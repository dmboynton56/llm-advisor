# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Paper entry policy at the broker submission boundary
prompts:
  - "{{case.scenario}}"
providers:
  - id: file://provider.py
    label: Real entry guard with simulated broker state
commandLineOptions:
  maxConcurrency: 1
defaultTest:
  assert:
    - type: equals
      value: "{{case.expected}}"
tests:
  - vars:
      case:
        scenario: Flat QQQ account allows a directional call
        expected: entry_allowed:1
  - vars:
      case:
        scenario: Open QQQ put blocks a call at a different strike and expiry
        positions: [{symbol: QQQ260930P00745000, qty: 4}]
        expected: underlying_exposure:0
  - vars:
      case:
        scenario: Open QQQ call blocks a put
        contract_type: put
        positions: [{symbol: QQQ260930C00745000, qty: 5}]
        expected: underlying_exposure:0
  - vars:
      case:
        scenario: Open QQQ call blocks another call
        positions: [{symbol: QQQ260930C00745000, qty: 5}]
        expected: underlying_exposure:0
  - vars:
      case:
        scenario: Accepted QQQ put buy blocks a call
        orders: [{symbol: QQQ260930P00745000, side: buy, status: accepted}]
        expected: underlying_exposure:0
  - vars:
      case:
        scenario: Partially filled QQQ call buy blocks a put
        contract_type: put
        orders: [{symbol: QQQ260930C00745000, side: buy, status: partially_filled}]
        expected: underlying_exposure:0
  - vars:
      case:
        scenario: Cancel request does not release exposure before broker confirmation
        orders: [{symbol: QQQ260930P00745000, side: buy, status: pending_cancel}]
        expected: underlying_exposure:0
  - vars:
      case:
        scenario: Exact held contract cannot be retried
        positions: [{symbol: QQQ261007C00748000, qty: 1}]
        expected: duplicate_option_contract:0
  - vars:
      case:
        scenario: Another underlying does not block a free QQQ slot
        positions: [{symbol: SPY260930P00600000, qty: 1}]
        expected: entry_allowed:1
  - vars:
      case:
        scenario: Exit sell order does not count as a pending entry
        orders: [{symbol: QQQ260930P00745000, side: sell, status: accepted}]
        expected: entry_allowed:1
  - vars:
      case:
        scenario: Canceled buy order no longer blocks entry
        orders: [{symbol: QQQ260930P00745000, side: buy, status: canceled}]
        expected: entry_allowed:1
  - vars:
      case:
        scenario: Unknown broker position state fails closed
        broker_position_error: true
        expected: broker_position_query_failed:0
  - vars:
      case:
        scenario: Unknown broker order state fails closed
        broker_order_error: true
        expected: broker_order_query_failed:0
  - vars:
      case:
        scenario: Existing stopout cooldown still blocks entry
        stopout: true
        expected: stopout_cooldown:0
  - vars:
      case:
        scenario: Pending entries count toward the three position cap
        positions: [{symbol: SPY260930P00600000, qty: 1}, {symbol: IWM260930C00250000, qty: 1}]
        orders: [{symbol: SPY261007C00600000, side: buy, status: accepted}]
        expected: max_concurrent_trades:0
  - vars:
      case:
        scenario: AAPL is observation only
        underlying: AAPL
        expected: monitor_only_symbol:0
  - vars:
      case:
        scenario: MSFT is observation only
        underlying: MSFT
        expected: monitor_only_symbol:0
  - vars:
      case:
        scenario: GOOG is observation only
        underlying: GOOG
        expected: monitor_only_symbol:0
  - vars:
      case:
        scenario: TSLA remains observation only even when explicitly requested for entry
        underlying: TSLA
        entry_symbols: [SPY, QQQ, IWM, TSLA]
        expected: monitor_only_symbol:0
  - vars:
      case:
        scenario: Explicit local promotion requires removal from the observation list
        underlying: TSLA
        entry_symbols: [SPY, QQQ, IWM, TSLA]
        monitor_symbols: [AAPL, MSFT, GOOG]
        expected: entry_allowed:1
  - vars:
      case:
        scenario: Full TSLA decision preview can approve technical news experiment without ML
        operation: shadow
        underlying: TSLA
        missing_ml: true
        expected: would_buy:0
  - vars:
      case:
        scenario: Core QQQ ML error remains a hard veto in preview
        operation: shadow
        missing_ml: true
        expected: skipped:0
  - vars:
      case:
        scenario: Shadow approval never overrides existing opposite TSLA exposure
        operation: shadow
        underlying: TSLA
        positions: [{symbol: TSLA261002P00300000, qty: 1}]
        expected: skipped:0
  - vars:
      case:
        scenario: Shadow preview rejects an invalid underlying risk reward ratio
        operation: shadow
        underlying: TSLA
        bad_rr: true
        expected: skipped:0
  - vars:
      case:
        scenario: Shadow preview rejects illiquid option candidates
        operation: shadow
        underlying: TSLA
        no_candidate: true
        expected: skipped:0
  - vars:
      case:
        scenario: Shadow preview respects buying power
        operation: shadow
        underlying: TSLA
        buying_power: 0
        expected: skipped:0
  - vars:
      case:
        scenario: Model rejection skips option submission in shadow
        operation: shadow
        underlying: TSLA
        llm_approval: false
        expected: skipped:0
  - vars:
      case:
        scenario: A string false from the LLM is a parse error not an approval
        operation: shadow
        underlying: TSLA
        llm_approval: 'false'
        expected: error:0
  - vars:
      case:
        scenario: Stock promotion date cannot be bypassed during the trial
        underlying: TSLA
        trial: before_start
        expected: monitor_only_symbol:0
  - vars:
      case:
        scenario: The configured stock cohort becomes paper eligible after the trial
        underlying: TSLA
        trial: after_start
        expected: entry_allowed:1
  - vars:
      case:
        scenario: Stock promotion retains the same underlying guard
        underlying: TSLA
        trial: after_start
        positions: [{symbol: TSLA261002P00300000, qty: 1}]
        expected: underlying_exposure:0
  - vars:
      case:
        scenario: Other observation symbols cannot inherit the stock promotion
        underlying: NVDA
        monitor_symbols: [AAPL, MSFT, GOOG, TSLA, NVDA]
        trial: after_start
        expected: monitor_only_symbol:0
  - vars:
      case:
        scenario: An LLM approval carrying a hard veto must still skip the trade
        operation: shadow
        underlying: TSLA
        veto_flags: [event_risk]
        expected: skipped:0
  - vars:
      case:
        scenario: Broker lookup failures appear as errors in the trial decision record
        operation: shadow
        underlying: TSLA
        broker_position_error: true
        expected: error:0

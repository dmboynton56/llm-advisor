name: Live Trading Loop

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols to trade (comma separated)"
        required: false
        default: "SPY,QQQ,IWM"

permissions:
  contents: read
  actions: read

jobs:
  morning:
    uses: ./.github/workflows/live_segment.yml
    with:
      symbols: ${{ inputs.symbols || 'SPY,QQQ,IWM' }}
      segment: morning
      session_cutoff: "12:35"
    secrets: inherit

  afternoon:
    needs: morning
    uses: ./.github/workflows/live_segment.yml
    with:
      symbols: ${{ inputs.symbols || 'SPY,QQQ,IWM' }}
      segment: afternoon
      session_cutoff: ""
    secrets: inherit

name: Live Trading Segment

on:
  workflow_call:
    inputs:
      symbols:
        required: true
        type: string
      segment:
        required: true
        type: string
      session_cutoff:
        required: false
        default: ""
        type: string
      handoff_segment:
        required: false
        default: ""
        type: string
      entry_mode:
        required: false
        default: normal
        type: string

permissions:
  contents: read
  actions: read

jobs:
  run-segment:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER_TRADING: true
      TRADING_INSTRUMENT: options
      OPTIONS_PAPER_ONLY: true
      ALLOW_STOCK_FALLBACK: false
      OPTIONS_STRATEGY_TYPE: single_long
      OPTION_DTE_MIN: 7
      OPTION_DTE_MAX: 14
      OPTION_DELTA_MIN: 0.35
      OPTION_DELTA_MAX: 0.55
      # Paper sizing trial: larger individual orders while keeping gross
      # planned premium exposure near the prior 2% x 3 = 6% profile.
      MAX_RISK_PER_TRADE_PERCENT: 3.0
      # Five-session paper-only late-session fill recovery canary.
      MAX_CONCURRENT_TRADES: 3
      MAX_OPTION_PREMIUM_PER_TRADE: 3000
      MAX_OPTION_BID_ASK_SPREAD_PCT: 0.15
      MIN_OPTION_OPEN_INTEREST: 100
      OPTION_STRIKE_WINDOW_PCT: 0.10
      OPTION_CONTRACT_LIMIT: 250
      OPTION_FALLBACK_ENABLED: true
      OPTION_FALLBACK_DTE_MIN: 3
      OPTION_FALLBACK_DTE_MAX: 21
      OPTION_FALLBACK_DELTA_MIN: 0.25
      OPTION_FALLBACK_DELTA_MAX: 0.65
      OPTION_FALLBACK_MAX_PREMIUM_PER_TRADE: 3000
      OPTION_FALLBACK_MAX_BID_ASK_SPREAD_PCT: 0.25
      OPTION_FALLBACK_MIN_OPEN_INTEREST: 25
      OPTION_FALLBACK_STRIKE_WINDOW_PCT: 0.15
      OPTION_FALLBACK_CONTRACT_LIMIT: 250
      OPTION_PROFIT_TARGET_PCT: 0.25
      OPTION_STOP_LOSS_PCT: 0.35
      # Paper-only RR trial: enroll only newly filled SPY/QQQ option positions
      # with at least four contracts.  Emergency flatten remains opt-in.
      OPTION_TIERED_EXIT_ENABLED: true
      OPTION_TIERED_EXIT_UNDERLYINGS: SPY,QQQ
      OPTION_TIERED_MIN_CONTRACTS: 4
      OPTION_TIERED_TP1_RETURN_PCT: 0.25
      OPTION_TIERED_TP1_FRACTION: 0.50
      OPTION_TIERED_TP2_RETURN_PCT: 0.50
      OPTION_TIERED_TP2_FRACTION: 0.25
      OPTION_TIERED_POST_TP1_STOP_RETURN_PCT: -0.05
      OPTION_TIERED_RUNNER_FLOOR_RETURN_PCT: 0.25
      OPTION_TIERED_RUNNER_GIVEBACK_PCT: 0.25
      OPTION_TIERED_EXIT_FILL_TIMEOUT_SECONDS: 120
      OPTION_TIERED_EMERGENCY_FLATTEN: false
      OPTION_MAX_HOLD_MINUTES: 2880
      OPTION_CLOSE_AT_ENTRY_WINDOW_END: false
      # Safety gate: do not restore overnight until the kill-loop protection test passes.
      OPTION_ALLOW_OVERNIGHT: false
      OPTION_EOD_FLATTEN_MAX_DTE: 0
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      STORAGE_ENV: bq
      TRADING_WINDOW_START: "09:30"
      TRADING_WINDOW_END: "15:30"
      END_OF_DAY_CLOSE_TIME: "15:50"
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      LIVE_STATE_PUBLISH_TICKS: "1"
      LIVE_ENTRY_MODE: ${{ inputs.entry_mode }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tiered exit paper preflight
        run: |
          python -m pytest -q tests/unit/test_tiered_exit.py
          python - <<'PY'
          from src.core.config import Settings
          settings = Settings.load()
          if not settings.options.paper_only:
              raise SystemExit("Tiered exit preflight requires OPTIONS_PAPER_ONLY=true")
          if not settings.options.tiered_exit_enabled:
              raise SystemExit("Tiered exit paper trial is not enabled")
          if settings.risk.max_risk_per_trade_percent != 3.0:
              raise SystemExit("Sizing trial requires MAX_RISK_PER_TRADE_PERCENT=3.0")
          if settings.trading.max_concurrent_trades != 3:
              raise SystemExit("Late-session fill canary requires MAX_CONCURRENT_TRADES=3")
          if settings.options.max_premium_per_trade != 3000.0:
              raise SystemExit("Sizing trial requires MAX_OPTION_PREMIUM_PER_TRADE=3000")
          if settings.options.fallback_max_premium_per_trade != 3000.0:
              raise SystemExit(
                  "Sizing trial requires OPTION_FALLBACK_MAX_PREMIUM_PER_TRADE=3000"
              )
          print("Tiered exit paper preflight passed")
          PY

      - name: Check market open
        run: python scripts/check_market_open.py

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Validate GCP auth
        run: |
          python -m json.tool "$GOOGLE_APPLICATION_CREDENTIALS" > /dev/null
          python - <<'PY'
          from google.cloud import bigquery
          client = bigquery.Client()
          print(f"BigQuery auth OK: {client.project}")
          PY

      - name: Find latest premarket artifact
        id: premarket_artifact
        timeout-minutes: 15
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const formatter = new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/New_York',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            })
            function etDate(value) {
              const parts = Object.fromEntries(
                formatter.formatToParts(new Date(value)).map((part) => [part.type, part.value])
              )
              return `${parts.year}-${parts.month}-${parts.day}`
            }

            const todayEt = etDate(new Date())
            const deadline = Date.now() + 12 * 60 * 1000
            while (true) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: 'premarket.yml',
                status: 'completed',
                per_page: 30,
              })
              for (const run of runs) {
                if (run.conclusion !== 'success') continue
                const finishedAt = run.updated_at || run.run_started_at || run.created_at
                if (!finishedAt || etDate(finishedAt) !== todayEt) continue
                const artifacts = await github.paginate(
                  github.rest.actions.listWorkflowRunArtifacts,
                  { owner, repo, run_id: run.id, per_page: 100 }
                )
                const artifact = artifacts.find((item) => item.name === 'premarket-context')
                if (artifact) {
                  core.setOutput('run_id', String(run.id))
                  core.setOutput('artifact_name', artifact.name)
                  core.setOutput('premarket_date', todayEt)
                  return
                }
              }
              if (Date.now() >= deadline) {
                core.setFailed(`No successful premarket-context artifact found for ${todayEt} ET.`)
                return
              }
              core.info(`Waiting for today's premarket-context artifact (${todayEt} ET)...`)
              await new Promise((resolve) => setTimeout(resolve, 30000))
            }

      # GitHub artifact storage can transiently return 429/503 responses. Retry
      # before failing the segment so a short service interruption does not
      # look like missing trading context.
      - name: Download premarket context (attempt 1)
        id: download_premarket_context_1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.premarket_artifact.outputs.artifact_name }}
          run-id: ${{ steps.premarket_artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .

      - name: Wait before premarket context retry
        if: steps.download_premarket_context_1.outcome == 'failure'
        run: sleep 15

      - name: Download premarket context (attempt 2)
        id: download_premarket_context_2
        if: steps.download_premarket_context_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.premarket_artifact.outputs.artifact_name }}
          run-id: ${{ steps.premarket_artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .

      - name: Wait before final premarket context retry
        if: steps.download_premarket_context_2.outcome == 'failure'
        run: sleep 30

      - name: Download premarket context (attempt 3)
        if: steps.download_premarket_context_2.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.premarket_artifact.outputs.artifact_name }}
          run-id: ${{ steps.premarket_artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .

      # A later manage_only segment can reconcile from the database when its
      # predecessor failed before producing a handoff. Keep normal mode fail
      # closed so a missing handoff can never silently permit new entries.
      - name: Download previous segment handoff (attempt 1)
        if: inputs.handoff_segment != ''
        id: download_handoff_1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: llm-advisor-handoff-${{ github.run_id }}-${{ inputs.handoff_segment }}
          path: .

      - name: Wait before previous segment handoff retry
        if: inputs.handoff_segment != '' && steps.download_handoff_1.outcome == 'failure'
        run: sleep 15

      - name: Download previous segment handoff (attempt 2)
        if: inputs.handoff_segment != '' && steps.download_handoff_1.outcome == 'failure'
        id: download_handoff_2
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: llm-advisor-handoff-${{ github.run_id }}-${{ inputs.handoff_segment }}
          path: .

      - name: Wait before final previous segment handoff retry
        if: inputs.handoff_segment != '' && steps.download_handoff_2.outcome == 'failure'
        run: sleep 30

      - name: Download previous segment handoff (attempt 3)
        if: inputs.handoff_segment != '' && steps.download_handoff_2.outcome == 'failure'
        id: download_handoff_3
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: llm-advisor-handoff-${{ github.run_id }}-${{ inputs.handoff_segment }}
          path: .

      - name: Validate previous segment handoff
        if: inputs.handoff_segment != ''
        env:
          ENTRY_MODE: ${{ inputs.entry_mode }}
          HANDOFF_ATTEMPT_1: ${{ steps.download_handoff_1.outcome }}
          HANDOFF_ATTEMPT_2: ${{ steps.download_handoff_2.outcome }}
          HANDOFF_ATTEMPT_3: ${{ steps.download_handoff_3.outcome }}
        run: |
          set -euo pipefail
          if [ "$HANDOFF_ATTEMPT_1" = "success" ] || \
             [ "$HANDOFF_ATTEMPT_2" = "success" ] || \
             [ "$HANDOFF_ATTEMPT_3" = "success" ]; then
            echo "Previous segment handoff downloaded successfully."
            exit 0
          fi
          if [ "$ENTRY_MODE" = "manage_only" ]; then
            echo "::warning::Previous segment handoff was unavailable; continuing in manage_only mode."
            exit 0
          fi
          echo "::error::Previous segment handoff was unavailable in normal mode."
          exit 1

      - name: Verify premarket context
        env:
          PREMARKET_DATE: ${{ steps.premarket_artifact.outputs.premarket_date }}
        run: |
          set -euo pipefail
          DEST="data/daily_news/${PREMARKET_DATE}/processed/premarket_context.json"
          if [ -f "$DEST" ]; then exit 0; fi
          if [ -f premarket_context.json ]; then
            mkdir -p "data/daily_news/${PREMARKET_DATE}/processed"
            mv premarket_context.json "$DEST"
            exit 0
          fi
          echo "::error::premarket_context.json not found"
          exit 1

      - name: Run live segment
        run: |
          SYMBOLS_SPACE=$(echo "${{ inputs.symbols }}" | tr ',' ' ')
          CUTOFF_ARGS=()
          if [ -n "${{ inputs.session_cutoff }}" ]; then
            CUTOFF_ARGS=(--session-cutoff "${{ inputs.session_cutoff }}")
          fi
          ENTRY_ARGS=(--entry-mode "${{ inputs.entry_mode }}")
          python scripts/run_live_loop.py \
            --symbols $SYMBOLS_SPACE \
            --use-db \
            --fast 60 \
            "${ENTRY_ARGS[@]}" \
            "${CUTOFF_ARGS[@]}"

      - name: Validate segment completion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summaries = sorted(Path("data/daily_news").glob("*/processed/session_summary.json"))
          if not summaries:
              raise SystemExit("Live loop exited without a session summary")
          payload = json.loads(summaries[-1].read_text(encoding="utf-8"))
          reason = payload.get("session_end_reason")
          segment = "${{ inputs.segment }}"
          allowed = (
              {"segment_handoff", "entry_window_closed_flat"}
              if segment != "closing"
              else {"eod_close", "entry_window_closed_flat"}
          )
          if reason not in allowed:
              raise SystemExit(
                  f"Unexpected {segment} segment exit reason {reason!r}; expected {sorted(allowed)}"
              )
          print(f"{segment} segment completed: {reason}")
          PY

      - name: Prepare telemetry artifact paths
        if: always()
        run: touch .telemetry-artifact-anchor

      - name: Upload segment handoff
        if: always() && inputs.segment != 'closing'
        uses: actions/upload-artifact@v4
        with:
          name: llm-advisor-handoff-${{ github.run_id }}-${{ inputs.segment }}
          path: |
            data/daily_news/
            .telemetry-artifact-anchor
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload segment daily telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-advisor-daily-news-${{ github.run_id }}-${{ inputs.segment }}
          path: |
            data/daily_news/
            .telemetry-artifact-anchor
          include-hidden-files: true
          if-no-files-found: warn

      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ **LLM Advisor ${{ inputs.segment }} Segment Failed**\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"

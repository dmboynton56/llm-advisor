name: Live Trading Segment

on:
  workflow_call:
    inputs:
      symbols:
        required: true
        type: string
      segment:
        required: true
        type: string
      session_cutoff:
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  run-segment:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER_TRADING: true
      TRADING_INSTRUMENT: options
      OPTIONS_PAPER_ONLY: true
      ALLOW_STOCK_FALLBACK: false
      OPTIONS_STRATEGY_TYPE: single_long
      OPTION_DTE_MIN: 7
      OPTION_DTE_MAX: 14
      OPTION_DELTA_MIN: 0.35
      OPTION_DELTA_MAX: 0.55
      MAX_RISK_PER_TRADE_PERCENT: 2.0
      MAX_CONCURRENT_TRADES: 3
      MAX_OPTION_PREMIUM_PER_TRADE: 2000
      MAX_OPTION_BID_ASK_SPREAD_PCT: 0.15
      MIN_OPTION_OPEN_INTEREST: 100
      OPTION_STRIKE_WINDOW_PCT: 0.10
      OPTION_CONTRACT_LIMIT: 250
      OPTION_FALLBACK_ENABLED: true
      OPTION_FALLBACK_DTE_MIN: 3
      OPTION_FALLBACK_DTE_MAX: 21
      OPTION_FALLBACK_DELTA_MIN: 0.25
      OPTION_FALLBACK_DELTA_MAX: 0.65
      OPTION_FALLBACK_MAX_PREMIUM_PER_TRADE: 2500
      OPTION_FALLBACK_MAX_BID_ASK_SPREAD_PCT: 0.25
      OPTION_FALLBACK_MIN_OPEN_INTEREST: 25
      OPTION_FALLBACK_STRIKE_WINDOW_PCT: 0.15
      OPTION_FALLBACK_CONTRACT_LIMIT: 250
      OPTION_PROFIT_TARGET_PCT: 0.25
      OPTION_STOP_LOSS_PCT: 0.35
      OPTION_MAX_HOLD_MINUTES: 2880
      OPTION_CLOSE_AT_ENTRY_WINDOW_END: false
      # Safety gate: do not restore overnight until the kill-loop protection test passes.
      OPTION_ALLOW_OVERNIGHT: false
      OPTION_EOD_FLATTEN_MAX_DTE: 0
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      STORAGE_ENV: bq
      TRADING_WINDOW_START: "09:30"
      TRADING_WINDOW_END: "15:30"
      END_OF_DAY_CLOSE_TIME: "15:50"
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      LIVE_STATE_PUBLISH_TICKS: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check market open
        run: python scripts/check_market_open.py

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Validate GCP auth
        run: |
          python -m json.tool "$GOOGLE_APPLICATION_CREDENTIALS" > /dev/null
          python - <<'PY'
          from google.cloud import bigquery
          client = bigquery.Client()
          print(f"BigQuery auth OK: {client.project}")
          PY

      - name: Find latest premarket artifact
        id: premarket_artifact
        timeout-minutes: 15
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const formatter = new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/New_York',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            })
            function etDate(value) {
              const parts = Object.fromEntries(
                formatter.formatToParts(new Date(value)).map((part) => [part.type, part.value])
              )
              return `${parts.year}-${parts.month}-${parts.day}`
            }

            const todayEt = etDate(new Date())
            const deadline = Date.now() + 12 * 60 * 1000
            while (true) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: 'premarket.yml',
                status: 'completed',
                per_page: 30,
              })
              for (const run of runs) {
                if (run.conclusion !== 'success') continue
                const finishedAt = run.updated_at || run.run_started_at || run.created_at
                if (!finishedAt || etDate(finishedAt) !== todayEt) continue
                const artifacts = await github.paginate(
                  github.rest.actions.listWorkflowRunArtifacts,
                  { owner, repo, run_id: run.id, per_page: 100 }
                )
                const artifact = artifacts.find((item) => item.name === 'premarket-context')
                if (artifact) {
                  core.setOutput('run_id', String(run.id))
                  core.setOutput('artifact_name', artifact.name)
                  core.setOutput('premarket_date', todayEt)
                  return
                }
              }
              if (Date.now() >= deadline) {
                core.setFailed(`No successful premarket-context artifact found for ${todayEt} ET.`)
                return
              }
              core.info(`Waiting for today's premarket-context artifact (${todayEt} ET)...`)
              await new Promise((resolve) => setTimeout(resolve, 30000))
            }

      - name: Download premarket context
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.premarket_artifact.outputs.artifact_name }}
          run-id: ${{ steps.premarket_artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .

      - name: Download morning handoff
        if: inputs.segment == 'afternoon'
        uses: actions/download-artifact@v4
        with:
          name: llm-advisor-handoff-${{ github.run_id }}
          path: .

      - name: Verify premarket context
        env:
          PREMARKET_DATE: ${{ steps.premarket_artifact.outputs.premarket_date }}
        run: |
          set -euo pipefail
          DEST="data/daily_news/${PREMARKET_DATE}/processed/premarket_context.json"
          if [ -f "$DEST" ]; then exit 0; fi
          if [ -f premarket_context.json ]; then
            mkdir -p "data/daily_news/${PREMARKET_DATE}/processed"
            mv premarket_context.json "$DEST"
            exit 0
          fi
          echo "::error::premarket_context.json not found"
          exit 1

      - name: Run live segment
        run: |
          SYMBOLS_SPACE=$(echo "${{ inputs.symbols }}" | tr ',' ' ')
          CUTOFF_ARGS=()
          if [ -n "${{ inputs.session_cutoff }}" ]; then
            CUTOFF_ARGS=(--session-cutoff "${{ inputs.session_cutoff }}")
          fi
          python scripts/run_live_loop.py \
            --symbols $SYMBOLS_SPACE \
            --use-db \
            --fast 60 \
            "${CUTOFF_ARGS[@]}"

      - name: Validate segment completion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summaries = sorted(Path("data/daily_news").glob("*/processed/session_summary.json"))
          if not summaries:
              raise SystemExit("Live loop exited without a session summary")
          payload = json.loads(summaries[-1].read_text(encoding="utf-8"))
          reason = payload.get("session_end_reason")
          segment = "${{ inputs.segment }}"
          allowed = (
              {"segment_handoff"}
              if segment == "morning"
              else {"eod_close", "entry_window_closed_flat"}
          )
          if reason not in allowed:
              raise SystemExit(
                  f"Unexpected {segment} segment exit reason {reason!r}; expected {sorted(allowed)}"
              )
          print(f"{segment} segment completed: {reason}")
          PY

      - name: Prepare telemetry artifact paths
        if: always()
        run: touch .telemetry-artifact-anchor

      - name: Upload morning handoff
        if: always() && inputs.segment == 'morning'
        uses: actions/upload-artifact@v4
        with:
          name: llm-advisor-handoff-${{ github.run_id }}
          path: |
            data/daily_news/
            .telemetry-artifact-anchor
          if-no-files-found: warn

      - name: Upload emergency daily telemetry
        if: failure() && inputs.segment == 'morning'
        uses: actions/upload-artifact@v4
        with:
          name: llm-advisor-daily-news-${{ github.run_id }}
          path: |
            data/daily_news/
            .telemetry-artifact-anchor
          if-no-files-found: warn

      - name: Upload final daily telemetry
        if: always() && inputs.segment == 'afternoon'
        uses: actions/upload-artifact@v4
        with:
          name: llm-advisor-daily-news-${{ github.run_id }}
          path: |
            data/daily_news/
            .telemetry-artifact-anchor
          if-no-files-found: warn

      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ **LLM Advisor ${{ inputs.segment }} Segment Failed**\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"
